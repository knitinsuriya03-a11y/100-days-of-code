<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    {% block styles %}
    <!-- Load Bootstrap-Flask CSS here -->
        {{ bootstrap.load_css() }}
    <!-- Link to the styles.css here to apply styling to all the child templates.-->
        <link rel="stylesheet" href="{{ url_for('static',filename='css/styles.css') }}">
    {% endblock %}
    <title>{% block title %}Desk & Drip{% endblock %}</title>
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner">
        <a class="brand" href="{{ url_for('home') }}">
          <span class="brand-mark">☕</span>
          <span>Desk<span class="brand-accent">&amp;</span>Drip</span>
        </a>
        <div class="nav-links">
          <a href="{{ url_for('cafes') }}">Browse cafes</a>
          <a class="nav-cta" href="{{ url_for('add_cafe') }}">Add a cafe <span>+</span></a>
        </div>
      </div>
    </nav>
    {% block content %}{% endblock %}
    <footer class="site-footer">
      <span>Made for better workdays.</span>
      <span class="footer-dot">•</span>
      <span>Community-sourced cafe spots</span>
    </footer>
  </body>
</html>
